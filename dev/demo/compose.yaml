# Dodock Wolf demo stack: one Dokos bench, one site with dodock_wolf, nginx, the Wolf agent
# and a webhook sink. See dev/demo/README.md.
name: wolfdemo

x-bench: &bench
  image: wolf-demo:local
  hostname: demo-host
  restart: on-failure
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    create-site:
      condition: service_completed_successfully

services:
  db:
    image: mariadb:10.6
    restart: on-failure
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --skip-character-set-client-handshake]
    environment:
      MARIADB_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
  redis-queue:
    image: redis:6.2-alpine

  create-site:
    image: wolf-demo:local
    build:
      context: ../..
      dockerfile: dev/demo/Dockerfile
      args:
        BASE: ${WOLF_DEMO_BASE:-registry.gitlab.com/dokos/dokos:latest}
        WITH_RAVEN: ${WOLF_DEMO_RAVEN:-0}
    hostname: demo-host
    restart: "no"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    entrypoint: [bash, -c]
    command:
      - |
        set -e
        ls -1 apps > sites/apps.txt
        [ -e sites/assets ] || ln -s /home/frappe/frappe-bench/assets sites/assets
        bench set-config -g db_host db
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache redis://redis-cache:6379
        bench set-config -g redis_queue redis://redis-queue:6379
        bench set-config -g redis_socketio redis://redis-queue:6379
        bench set-config -gp socketio_port 9000
        # Wolf's rules are scheduled every minute; Frappe's default tick is 4 minutes
        bench set-config -gp scheduler_tick_interval 60
        bench set-config -gp server_script_enabled 1
        if [ ! -d sites/wolf.localhost ]; then
          bench new-site wolf.localhost --mariadb-user-host-login-scope='%' \
            --admin-password=admin --db-root-username=root --db-root-password=admin \
            --install-app dodock_wolf --set-default
          bench --site wolf.localhost set-config enable_frappe_logger 1
        else
          bench --site wolf.localhost migrate
        fi
        bench --site wolf.localhost enable-scheduler
        # Skip the setup wizard: the demo only needs Desk.
        bench --site wolf.localhost execute frappe.db.set_single_value --args '["System Settings", "setup_complete", 1]'
        bench --site wolf.localhost execute frappe.db.set_value \
          --args '["Installed Application", {"app_name": ["in", ["frappe", "dodock_wolf"]]}, "is_setup_complete", 1]'
        bench --site wolf.localhost execute frappe.db.set_default --args '["desktop:home_page", "workspace"]'
        # Hand the registration token to the demo agent (it never runs bench itself).
        bench --site wolf.localhost execute frappe.utils.password.get_decrypted_password \
          --args '["Wolf Settings", "Wolf Settings", "registration_token"]' | tail -1 | tr -d '"' > sites/.wolf-demo-token

  backend:
    <<: *bench
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../../ci/db_smoke.py:/etc/wolf/db_smoke.py:ro
  scheduler:
    <<: *bench
    command: [bench, schedule]
  # Two workers, like a real bench: long jobs (search index rebuilds after a migrate) must not
  # hold up the per-minute scheduled jobs, Wolf's rule evaluation included.
  queue:
    <<: *bench
    command: [bench, worker, --queue, "short,default"]
  queue-long:
    <<: *bench
    command: [bench, worker, --queue, "long"]
  websocket:
    <<: *bench
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]

  frontend:
    image: wolf-demo:local
    hostname: demo-host
    restart: on-failure
    user: root
    entrypoint: [nginx, -c, /etc/wolf/nginx.conf, -g, "daemon off;"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
      - nginx-logs:/var/log/wolf-nginx
      - ./nginx.conf:/etc/wolf/nginx.conf:ro
    depends_on: [backend, websocket]
    ports:
      - "8099:8080"

  agent:
    image: wolf-demo:local
    hostname: demo-host
    restart: on-failure
    user: frappe
    environment:
      WOLF_AGENT_CONFIG: /home/frappe/wolf-agent/config.json
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs:ro
      - nginx-logs:/var/log/wolf-nginx:ro
      - agent-state:/home/frappe/wolf-agent
      - ./agent-init.sh:/etc/wolf/agent-init.sh:ro
      # empty unless the "ids" profile runs Suricata: the agent finds eve.json there by itself
      - suricata-logs:/var/log/suricata:ro
    entrypoint: [bash, /etc/wolf/agent-init.sh]
    depends_on: [frontend]

  # Live demos (README "Live demos"): docker compose --profile press|multi|single up -d
  # Each runs a second agent on a simulated server that `bench generate-demo-<kind>` writes into
  # the demo-<kind> volume: history first, then live traffic and incidents.
  press-agent: &demo-agent
    image: wolf-demo:local
    profiles: [press]
    hostname: f1-demo-press
    restart: on-failure
    user: frappe
    environment:
      WOLF_AGENT_CONFIG: /home/frappe/demo-press/agent-config.json
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
      - demo-press:/home/frappe/demo-press
      - ./demo-agent-init.sh:/etc/wolf/demo-agent-init.sh:ro
    entrypoint: [bash, /etc/wolf/demo-agent-init.sh]
    command: [press, f1-demo-press]
    depends_on: [frontend]
  press-demo: &demo-writer
    <<: *bench
    profiles: [press]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - demo-press:/home/frappe/demo-press
    entrypoint: [bash, -c, 'until [ -f "/home/frappe/demo-$$0/agent-config.json" ]; do echo "waiting for $$0-agent"; sleep 3; done; exec bench --site wolf.localhost generate-demo-$$0 --webhook http://catcher:9999/']
    command: [press]
    depends_on: [press-agent]
  multi-agent:
    <<: *demo-agent
    profiles: [multi]
    hostname: dokos-multi-1
    environment:
      WOLF_AGENT_CONFIG: /home/frappe/demo-multi/agent-config.json
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
      - demo-multi:/home/frappe/demo-multi
      - ./demo-agent-init.sh:/etc/wolf/demo-agent-init.sh:ro
    command: [multi, dokos-multi-1]
  multi-demo:
    <<: *demo-writer
    profiles: [multi]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - demo-multi:/home/frappe/demo-multi
    command: [multi]
    depends_on: [multi-agent]
  single-agent:
    <<: *demo-agent
    profiles: [single]
    hostname: dokos-single-1
    environment:
      WOLF_AGENT_CONFIG: /home/frappe/demo-single/agent-config.json
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
      - demo-single:/home/frappe/demo-single
      - ./demo-agent-init.sh:/etc/wolf/demo-agent-init.sh:ro
    command: [single, dokos-single-1]
  single-demo:
    <<: *demo-writer
    profiles: [single]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - demo-single:/home/frappe/demo-single
    command: [single]
    depends_on: [single-agent]

  # Suricata and Wazuh next to the bench (README "Suricata and Wazuh"): docker compose --profile ids up -d
  # Suricata sniffs the frontend's interface, with ET Open, and names the client from
  # X-Forwarded-For as nginx's port 8081 does; the bench's agent reads its eve.json. The Wazuh manager reads
  # nginx's combined log; a Wolf agent on its host reads alerts.json.
  suricata:
    image: jasonish/suricata:7.0.17  # its suricata.yaml has eve-log as outputs.1 (the --set below)
    profiles: [ids]
    restart: on-failure
    network_mode: "service:frontend"
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    volumes:
      - suricata-logs:/var/log/suricata
      - suricata-rules:/var/lib/suricata
    entrypoint: [bash, -c]
    command:
      - |
        [ -s /var/lib/suricata/rules/suricata.rules ] || suricata-update -q --no-test || echo "suricata-update failed: no ET Open rules"
        # the frontend's ports only: nginx's own calls to the backend would count each attack twice.
        # EXTERNAL_NET any: in Docker the attacker's address is private, like HOME_NET
        exec suricata -i eth0 -k none \
          --set vars.address-groups.EXTERNAL_NET=any \
          --set outputs.1.eve-log.xff.enabled=yes --set outputs.1.eve-log.xff.mode=overwrite \
          --set outputs.1.eve-log.xff.deployment=forward \
          "tcp port 8080 or tcp port 8081"
    depends_on: [frontend]
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.2
    profiles: [ids]
    hostname: wazuh-manager
    restart: on-failure
    volumes:
      - wazuh-logs:/var/ossec/logs
      - nginx-logs:/var/log/wolf-nginx:ro
      - ./wazuh-wolf.sh:/entrypoint-scripts/wolf.sh:ro
    # after nginx has created the log it reads: Wazuh only picks up a missing file minutes later
    depends_on: [frontend]
  wazuh-wolf-agent:
    image: wolf-demo:local
    profiles: [ids]
    hostname: wazuh-manager
    restart: on-failure
    user: frappe
    # alerts.json is group wazuh (999 in the manager image): on a real manager, add wolf-agent to it
    group_add: ["999"]
    environment:
      WOLF_AGENT_CONFIG: /home/frappe/wolf-agent/config.json
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
      - wazuh-wolf-state:/home/frappe/wolf-agent
      - wazuh-logs:/var/ossec/logs:ro
      - ./wazuh-agent-init.sh:/etc/wolf/wazuh-agent-init.sh:ro
    entrypoint: [bash, /etc/wolf/wazuh-agent-init.sh]
    depends_on: [frontend, wazuh-manager]

  # Optional Postgres for portability checks: docker compose --profile postgres up -d pgdb
  pgdb:
    image: ${WOLF_DEMO_PG_IMAGE:-postgres:16}
    profiles: [postgres]
    restart: on-failure
    environment:
      POSTGRES_PASSWORD: admin
    volumes:
      - pg-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    restart: on-failure
    ports:
      - "8025:8025"

  catcher:
    image: wolf-demo:local
    restart: on-failure
    command: [python3, /etc/wolf/catcher.py]
    volumes:
      - ./catcher.py:/etc/wolf/catcher.py:ro

volumes:
  db-data:
  pg-data:
  sites:
  logs:
  nginx-logs:
  agent-state:
  demo-press:
  demo-multi:
  demo-single:
  suricata-logs:
  suricata-rules:
  wazuh-logs:
  wazuh-wolf-state:
